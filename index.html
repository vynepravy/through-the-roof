<body>

<script>
'use strict';
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug'), AUTO = Q.has('auto'), GOD = Q.has('god');
const SPEED0 = +Q.get('speed') || 560;   // мс на шаг айтема на первом уровне
const GOAL = +Q.get('goal') || 0;
const START_LVL = +Q.get('lvl') || 1;
const FPX = '"Press Start 2P", monospace';
const GAME_URL = 'vynepravy.github.io/through-the-roof';   // адрес публикации — для подвала карточек
const C = { K: '#070B22', W: '#F2F5FF', E: '#3BE37F', Y: '#FFC81E', o: '#FF9A3D', R: '#E8322B', G: '#22B04B', B: '#1E4EDB', navy: '#0E1640', mut: '#C9D6FA' };

// ================= растеризатор: векторные формы → палитра с дизерингом 8×8 + контур =================
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const B8 = [[0, 32, 8, 40, 2, 34, 10, 42], [48, 16, 56, 24, 50, 18, 58, 26], [12, 44, 4, 36, 14, 46, 6, 38], [60, 28, 52, 20, 62, 30, 54, 22], [3, 35, 11, 43, 1, 33, 9, 41], [51, 19, 59, 27, 49, 17, 57, 25], [15, 47, 7, 39, 13, 45, 5, 37], [63, 31, 55, 23, 61, 29, 53, 21]];
const RAMP = {
  white: ['#3F4F8C', '#7C8FCC', '#BCC9EE', '#F2F5FF'],
  ink: ['#070B22', '#152056', '#2F4290'],
  navy: ['#070B22', '#121C4E', '#22348A', '#4B63B4'],
  green: ['#0D4A2E', '#1F9A55', '#3BE37F', '#B9F8D2'],
  yellow: ['#8A5A00', '#D99A00', '#FFC81E', '#FFF1A6'],
  orange: ['#B5501A', '#FF9A3D', '#FFE0A0'],
  blue: ['#0F2A80', '#1E4EDB', '#5C80EC', '#A9C4FF', '#F2F5FF'],
  steel: ['#070B22', '#14205A', '#2B3C8C', '#5C80EC', '#A9C4FF'],
  crystal: ['#3F66D8', '#7FA0FF', '#A9C4FF', '#D5E2FF', '#FFFFFF'],
  glass: ['#0F2E8E', '#1E46B4', '#3360D2', '#6A8CEE', '#A9C4FF'],
  leaf: ['#082A22', '#124A39', '#1D6A4E', '#2F8C66', '#5DBB8C'],
  cloud: ['#4268E2', '#5579E8', '#6C8DEE', '#88A5F3'],
  cloudFar: ['#3A62DE', '#4870E4', '#5A80EA'],
  tower: ['#3B5FD8', '#4669E0', '#5577E6', '#6A8BEC', '#86A3F2'],
  city: ['#5072E4', '#5E80EA', '#6E8FEE', '#86A3F2'],
  red: ['#8E1612', '#E8322B', '#FF8A7F'],
  kaiju: ['#06150F', '#0D2B20', '#174A37', '#25704F', '#45A076'],
  belly: ['#355E4C', '#6FA88A', '#B6E2C8'],
  R: ['#E8322B'], G: ['#22B04B'], B: ['#1E4EDB'], Y: ['#FFC81E'], K: ['#070B22'], Wf: ['#F2F5FF'],
};
const RKEYS = Object.keys(RAMP), RIDX = Object.fromEntries(RKEYS.map((k, i) => [k, i]));
const RGBC = {}; const rgbOf = h => RGBC[h] || (RGBC[h] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const gray = v => { const k = Math.round(Math.max(0, Math.min(1, v)) * 255); return `rgb(${k},${k},${k})`; };
const lin = (x0, y0, x1, y1, st) => c => { const g = c.createLinearGradient(x0, y0, x1, y1); st.forEach(([o, v]) => g.addColorStop(o, gray(v))); return g; };
const rad = (x0, y0, r0, x1, y1, r1, st) => c => { const g = c.createRadialGradient(x0, y0, r0, x1, y1, r1); st.forEach(([o, v]) => g.addColorStop(o, gray(v))); return g; };
const ball = (x, y, r, lo = 0.25, hi = 1) => rad(x - r * 0.45, y - r * 0.5, r * 0.1, x, y, r * 1.25, [[0, hi], [0.55, (hi + lo) / 2 + 0.12], [1, lo]]);
const E = (x, y, rx, ry, rot = 0) => c => { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); };
const RR = (x, y, w, h, r = 1) => c => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
const PL = pts => c => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
const PATH = f => c => { c.beginPath(); f(c); };

function art(w, h, draw, { outline = C.K, outline2 = null, aura = null, pad = 2 } = {}) {
  const W2 = Math.round(w) + pad * 2, H2 = Math.round(h) + pad * 2, N = W2 * H2;
  const mat = new Int16Array(N).fill(-1), ton = new Float32Array(N);
  const tm = mk(W2, H2).getContext('2d', { willReadFrequently: true }), tt = mk(W2, H2).getContext('2d', { willReadFrequently: true });
  const post = [];
  const put = (path, ramp, tone, stroke, lw) => {
    for (const [c, style] of [[tm, '#fff'], [tt, typeof tone === 'number' ? gray(tone) : null]]) {
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W2, H2); c.translate(pad, pad);
      path(c);
      const st = style || tone(c);
      if (stroke) { c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = st; c.stroke(); } else { c.fillStyle = st; c.fill(); }
    }
    const a = tm.getImageData(0, 0, W2, H2).data, t = tt.getImageData(0, 0, W2, H2).data, id = ramp === null ? -1 : RIDX[ramp];
    for (let i = 0; i < N; i++) if (a[i * 4 + 3] >= 128) { mat[i] = id; ton[i] = t[i * 4] / 255; }
  };
  const api = {
    fill: (path, ramp, tone = 0.7) => put(path, ramp, tone, false),
    stroke: (path, ramp, tone, lw) => put(path, ramp, tone, true, lw),
    erase: path => put(path, null, 0, false),
    post: f => post.push(f),
  };
  draw(api);
  const out = mk(W2, H2), oc = out.getContext('2d'), img = oc.createImageData(W2, H2), d = img.data;
  const set = (i, hex) => { const c = rgbOf(hex); d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255; };
  for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
    const i = y * W2 + x; if (mat[i] < 0) continue;
    const r = RAMP[RKEYS[mat[i]]], n = r.length;
    if (n === 1) { set(i, r[0]); continue; }
    const v = ton[i] * (n - 1), b0 = Math.min(n - 2, Math.floor(v)), f = v - b0;
    set(i, f * 64 > B8[y & 7][x & 7] + 0.5 ? r[b0 + 1] : r[b0]);
  }
  const solid = i => mat[i] >= 0;
  const ring = (test, hex) => {
    const mark = [];
    for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
      const i = y * W2 + x; if (d[i * 4 + 3]) continue;
      if ((x > 0 && test(i - 1)) || (x < W2 - 1 && test(i + 1)) || (y > 0 && test(i - W2)) || (y < H2 - 1 && test(i + W2))) mark.push(i);
    }
    mark.forEach(i => set(i, hex)); return new Set(mark);
  };
  let o1 = null;
  if (outline) o1 = ring(solid, outline);
  if (outline2 && o1) ring(i => o1.has(i), outline2);
  if (aura) for (let k = 0; k < 2; k++) {        // мягкое свечение дизерингом
    const lit = new Set(); for (let i = 0; i < N; i++) if (d[i * 4 + 3]) lit.add(i);
    const mark = [];
    for (let y = 1; y < H2 - 1; y++) for (let x = 1; x < W2 - 1; x++) { const i = y * W2 + x; if (!d[i * 4 + 3] && (lit.has(i - 1) || lit.has(i + 1) || lit.has(i - W2) || lit.has(i + W2)) && B8[y & 7][x & 7] < (k ? 16 : 34)) mark.push(i); }
    mark.forEach(i => set(i, aura));
  }
  oc.putImageData(img, 0, 0);
  oc.translate(pad, pad);
  const px = (x, y, w = 1, h = 1, col) => { oc.fillStyle = col; oc.fillRect(Math.round(x), Math.round(y), w, h); };
  post.forEach(f => f(oc, px));
  out.pad = pad;
  return out;
}
const ART = new Map();
const cachedArt = (key, f) => { let a = ART.get(key); if (!a) { a = f(); ART.set(key, a); } return a; };
const PIX = (oc, rows, x, y, map) => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== '.') { oc.fillStyle = map[ch]; oc.fillRect(x + i, y + j, 1, 1); } }));
const MINI_STAR = ['..Y..', '.YYY.', 'YYYYY', '.YYY.', '.Y.Y.'];
const RUB = ['.WWWW.', '.W...W', '.W...W', '.WWWW.', 'WWWW..', '.W....', '.W....'];

// ================= щенок: несколько моделей на выбор (?dog=chibi|flat|classic|cur) =================
const DOG_STYLE = Q.get('dog') || 'gen';
const DOGS = {
  chibi: { w: 56, h: 46, mode: 'cel', head: [38, 15, 12.5], snout: [48.5, 20.5, 6, 4.3], nose: [53.6, 19, 2.3, 1.9], ear: [30, 19, 3.4, 7, 0.12], eye: [42, 11, 3, 4], smile: [[45, 24], [46, 25], [47, 25], [48, 24]],
    body: [21, 31, 13, 8.5], chest: [30, 30, 8, 8], neck: null, legs: { len: 9, w: 5.4, fb: [14, 35], ff: [30, 35], nb: [19, 36], nf: [35, 36] },
    tail: [[9, 28], [1, 26], [4, 16]], tailW: 3.8, spots: [[15, 27, 2.7, 2.3], [24, 26.5, 2.3, 2], [11.5, 33, 2.1, 2.2], [27, 34, 2.3, 1.9], [19.5, 34, 1.9, 1.7]],
    dots: [[32, 7, 1.3], [36, 4.5, 1], [26, 29, 1], [44, 27.5, 0.9]], collar: [32, 25.5, [0.45, -0.9]], clen: 6 },
  classic: { w: 62, h: 46, mode: 'cel', head: [45, 11, 9.5], snout: [53.5, 15, 6, 4], nose: [58.6, 13.4, 2.2, 1.9], ear: [38.5, 12.5, 3.8, 7.5, 0.3], eye: [48, 8, 2, 3], smile: [[52, 18], [53, 19], [54, 19], [55, 18]],
    body: [24, 25, 14.5, 9], chest: [37, 24, 8, 9.5], neck: [[33, 21], [40, 7], [49, 10], [44, 27]], legs: { len: 14, w: 4.8, fb: [16, 28], ff: [37, 28], nb: [21, 29], nf: [41, 29] },
    tail: [[11, 22], [3, 19], [4, 8]], tailW: 3.2, spots: [[18, 20, 2.8, 2.1], [28, 20.5, 2.2, 1.9], [13, 28, 2.3, 2.5], [31, 29, 2.5, 2], [24, 30.5, 2.1, 1.8]],
    dots: [[36, 18.5, 1.2], [40.5, 26.5, 1.1], [44.5, 17, 1], [9, 25, 1]], collar: [39.5, 17.5, [0.7, -0.7]], clen: 5.5 },
};
DOGS.flat = { ...DOGS.chibi, mode: 'flat' };
function dogGen(st, frame, spots, star) {
  const D = DOGS[st];
  return art(D.w, D.h, a => {
    const L = { stand: [0, 0, 0, 0], run1: [0.45, -0.4, -0.35, 0.4], run2: [-0.4, 0.35, 0.45, -0.45] }[frame];
    const flat = D.mode === 'flat', T1 = 1, T2 = 0.667;
    const cel = (big, light) => { a.fill(big, 'white', flat ? T1 : T2); if (!flat) a.fill(light, 'white', T1); };
    const leg = (p, ang, near) => {
      const [x, y] = p, { len, w } = D.legs;
      a.fill(c => { c.beginPath(); c.save(); c.translate(x, y); c.rotate(ang); if (c.roundRect) c.roundRect(-w / 2, 0, w, len, w / 2); else c.rect(-w / 2, 0, w, len); c.restore(); }, 'white', near ? T1 : T2);
      a.fill(E(x - Math.sin(ang) * (len - 0.5) + 1.2, y + Math.cos(ang) * (len - 0.5), w * 0.7, 2), 'white', near ? T1 : T2);
    };
    leg(D.legs.fb, L[2], false); leg(D.legs.ff, L[3], false);
    a.stroke(PATH(c => { c.moveTo(...D.tail[0]); c.quadraticCurveTo(...D.tail[1], ...D.tail[2]); }), 'white', T1, D.tailW);
    const [bx, by, brx, bry] = D.body; cel(E(bx, by, brx, bry), E(bx - 1.5, by - 1.8, brx - 1.2, bry - 1.8));
    const [cx, cy, crx, cry] = D.chest; cel(E(cx, cy, crx, cry), E(cx - 1, cy - 1.5, crx - 1.2, cry - 1.6));
    if (D.neck) a.fill(PL(D.neck), 'white', T1);
    leg(D.legs.nb, L[0], true); leg(D.legs.nf, L[1], true);
    const [hx, hy, hr] = D.head; cel(E(hx, hy, hr, hr * 0.95), E(hx - 1.6, hy - 1.6, hr - 1.6, hr * 0.95 - 1.9));
    a.fill(E(...D.snout), 'white', T1);
    a.fill(E(D.ear[0], D.ear[1], D.ear[2], D.ear[3], D.ear[4]), 'ink', 0.25);
    a.fill(E(D.nose[0], D.nose[1], D.nose[2], D.nose[3]), 'ink', 0);
    D.spots.forEach(([x, y, rx, ry], i) => { if (i < spots) a.fill(E(x, y, rx, ry), 'ink', 0); });
    D.dots.forEach(([x, y, r]) => a.fill(E(x, y, r, r), 'ink', 0));
    a.post((oc, px) => {
      const [ex, ey, ew, eh] = D.eye;
      px(ex, ey, ew, eh, C.K); px(ex, ey, 1, 1, C.W); if (ew > 2) px(ex + ew - 1, ey + eh - 1, 1, 1, '#7C8FCC');
      px(D.nose[0] - 1, D.nose[1] - 1, 1, 1, '#7C8FCC');
      D.smile.forEach(([x, y]) => px(x, y, 1, 1, '#3F4F8C'));
      const [ccx, ccy, n] = D.collar, p = [-n[1], n[0]];
      [C.R, C.G, C.B, C.Y].forEach((col, k) => { for (let t = -D.clen; t <= D.clen; t += 0.5) px(ccx + p[0] * t + n[0] * (k - 1.5), ccy + p[1] * t + n[1] * (k - 1.5), 1, 1, col); });
      if (star) { const sx = Math.round(ccx + p[0] * D.clen * 0.55), sy = Math.round(ccy + p[1] * D.clen * 0.55 + 2); px(sx, sy, 1, 1, C.K); PIX(oc, MINI_STAR, sx - 2, sy + 1, { Y: C.Y }); }
    });
  });
}
// модель по референсу пользователя: высокая стойка, голова поднята, открытая пасть с языком, плоские заливки, серые дальние лапы
function dogRef(frame, spots, star) {
  return art(50, 52, a => {

function cityArt(w, h) {
  return cachedArt(`city${w}x${h}`, () => {
    const c = mk(w, h), x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data;
    const R = RAMP.city.map(rgbOf), set = (i, col) => { d[i * 4] = col[0]; d[i * 4 + 1] = col[1]; d[i * 4 + 2] = col[2]; d[i * 4 + 3] = 255; };
    const rect = (x0, y0, ww, hh, toneFn) => { x0 = Math.round(x0); y0 = Math.round(y0); ww = Math.round(ww); hh = Math.round(hh); for (let yy = Math.max(0, y0); yy < Math.min(h, y0 + hh); yy++) for (let xx = Math.max(0, x0); xx < Math.min(w, x0 + ww); xx++) { const v = toneFn(xx - x0, yy - y0) * (R.length - 1), b0 = Math.min(R.length - 2, Math.floor(v)); set(yy * w + xx, (v - b0) * 64 > B8[yy & 7][xx & 7] + 0.5 ? R[b0 + 1] : R[b0]); } };
    const r = (() => { let s = 21; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
    let x0 = -6;
    while (x0 < w) {
      const ww = 14 + Math.floor(r() * 22), hh = 16 + Math.floor(r() * 46);
      rect(x0, h - hh, ww, hh, (u, v) => 0.55 - u / ww * 0.35 + ((u % 5 === 2 && v % 6 > 2 && r() < 0.5) ? 0.35 : 0));
      x0 += ww + 1;
    }
    // сталинская высотка: ступенчатые ярусы и шпиль со звездой
    const hx = Math.round(w * 0.2);
    [[34, 30], [24, 26], [16, 22], [9, 16]].reduce((y, [ww, hh]) => { rect(hx - ww / 2, y - hh, ww, hh, (u, v) => 0.85 - u / ww * 0.6 + (u % 4 === 1 && v % 5 > 1 ? 0.2 : 0)); return y - hh; }, h);
    rect(hx - 1, h - 94 - 22, 2, 22, () => 0.8);
    x.putImageData(img, 0, 0);
    x.fillStyle = '#A9C4FF'; x.fillRect(hx - 1, h - 94 - 25, 3, 3);
    return c;
  });
}

function makeIcon(size) {   // мордочка щенка на синем
  const c = mk(size, size), o = c.getContext('2d'); o.imageSmoothingEnabled = false;
  o.fillStyle = '#1E4EDB'; o.fillRect(0, 0, size, size);
  const d = dogArt('stand', 5, false), pd = d.pad, sx = pd + 20, sy = pd, sw = 40, sh = 40;
  o.drawImage(d, sx, sy, sw, sh, Math.round(size * 0.06), Math.round(size * 0.12), Math.round(size * 0.92), Math.round(size * 0.92));
  return c;
}
async function buildAssets() {
  const save = (n, cv) => new Promise(r => cv.toBlob(b => fetch('/__save/' + n, { method: 'PUT', body: b }).then(x => r(x.ok))));
  return [await save('og.png', makeOG()), await save('apple-touch-icon.png', makeIcon(180)), await save('favicon-32.png', makeIcon(32)), await save('icon-512.png', makeIcon(512))];
}
async function shareCard() {
  if (!G || !G.lastCard) return;
  const blob = await new Promise(r => G.lastCard.toBlob(r, 'image/png'));
  const name = `vyshe-kryshi-${mode === 'over' ? G.level : G.level - 1}.png`;
  const file = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    const lvl = mode === 'over' ? G.level : G.level - 1, url = location.origin + location.pathname;
    try { await navigator.share({ files: [file], text: `Мой рекорд — ${lvl} уровень. «Выше крыши» — игра от RGBY: ${url}` }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ================= ввод и запуск =================
let last = performance.now();
function loop(t) { const dt = Math.min(0.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(loop); }
function toLogical(e) { const d = view.dpr || 1; return { x: (e.clientX * d - view.x) / K, y: (e.clientY * d - view.y) / K }; }
scr.addEventListener('pointerdown', e => {
  const p = toLogical(e);
  if (p.y < 28 && p.x > soundX() - 6 && p.x < soundX() + 14) { sInit(); sMute(!S.on); return; }
  moveDog(Math.floor(p.x / LW));
});
addEventListener('keydown', e => {
  if (mode === 'intro' && (e.key === ' ' || e.key === 'Enter')) { startGame(); return; }
  if (mode === 'card' && (e.key === ' ' || e.key === 'Enter')) { nextLevel(); return; }
  if (mode === 'over' && modeT > 1.2 && (e.key === ' ' || e.key === 'Enter')) { startGame(); return; }
  if (e.key === 'm' || e.key === 'ь') { sInit(); sMute(!S.on); return; }
  if (!G) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ф') moveDog(G.dog - 1);
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'в') moveDog(G.dog + 1);
  else if (e.key >= '1' && e.key <= '4') moveDog(+e.key - 1);
});
document.getElementById('btnStart').onclick = startGame;
document.getElementById('btnAgain').onclick = startGame;
document.getElementById('btnNext').onclick = nextLevel;
document.getElementById('btnShare').onclick = shareCard;
document.getElementById('btnShareOver').onclick = shareCard;
document.addEventListener('visibilitychange', () => { if (document.hidden && S.ac) S.ac.suspend(); else if (S.ac && mode !== 'intro') S.ac.resume(); });
addEventListener('resize', resize);

Promise.all([`8px ${FPX}|УРОВЕНЬ ЁЩ`, `8px ${FPX}|RGBY 0123456789+:@`].map(s => { const [f, t] = s.split('|'); return document.fonts.load(f, t); })).catch(() => {}).then(() => {
  resize();
  const legend = (id, types) => { const box = document.getElementById(id); for (const t of types) { const a = itemArt(t), c = mk(a.width, a.height); c.getContext('2d').drawImage(a, 0, 0); c.title = ITEMS[t].label; box.appendChild(c); } };
  legend('lgGood', ['idea', 'money', 'heart', 'ok', 'coffee', 'brief']);
  legend('lgBad', ['bomb', 'pen', 'usd', 'gap', 'small']);
  requestAnimationFrame(loop);
  if (Q.has('go') || AUTO) startGame();
});
